<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Poker Balance</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♠</text></svg>">
  <link rel="stylesheet" href="styles/app.css" />
</head>
<body>
  <div id="app" class="app">
    <header class="header">
      <div class="header-left">
        <h1 class="title">Poker Balance</h1>
        <div class="config">
          <label for="stack-value" class="config-label">Stack value (chips)</label>
          <input id="stack-value" type="number" min="1" step="1" value="5000" class="input-stack" autocomplete="off" />
        </div>
      </div>
      <button id="reset" type="button" class="btn-reset">Reset</button>
    </header>

    <main class="main">
      <div class="table-wrap">
        <table class="grid">
          <colgroup>
            <col class="col-name" />
            <col class="col-start" />
            <col class="col-restacks" />
            <col class="col-final" />
            <col class="col-net" />
            <col class="col-adjusted" />
            <col class="col-settlements" />
            <col class="col-actions" />
          </colgroup>
          <thead>
            <tr>
              <th>Name</th>
              <th>Start</th>
              <th>Restacks</th>
              <th>Final</th>
              <th>Net&nbsp;P&L</th>
              <th>Adjusted</th>
              <th>Settlements</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="grid-body"></tbody>
        </table>
      </div>
      <div class="grid-footer">
        <button id="add-player" type="button" class="btn-add">+ Add player</button>
      </div>
    </main>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
