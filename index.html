<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Poker Balance</title>
  <meta
    name="description"
    content="Track poker chip counts, compute net P&L, and generate clean settlements in seconds."
  />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Poker Balance" />
  <meta property="og:title" content="Poker Balance" />
  <meta
    property="og:description"
    content="Track poker chip counts, compute net P&L, and generate clean settlements in seconds."
  />
  <meta property="og:image" content="icons/icon-512.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="512" />
  <meta property="og:image:height" content="512" />
  <meta property="og:image:alt" content="Poker Balance app icon" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Poker Balance" />
  <meta
    name="twitter:description"
    content="Track poker chip counts, compute net P&L, and generate clean settlements in seconds."
  />
  <meta name="twitter:image" content="icons/icon-512.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Poker Balance" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles/app.css" />
</head>
<body>
  <div id="app" class="app">
    <header class="header">
      <div class="header-left">
        <div class="title-row">
          <h1 class="title">Poker Balance</h1>
          <a
            class="title-link"
            href="https://github.com/Yann-J/poker-balance"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="View source on GitHub"
          >
            <span class="title-link-icon" aria-hidden="true"></span>
          </a>
        </div>
        <div class="config">
          <label for="stack-value" class="config-label">Stack value (chips)</label>
          <input id="stack-value" type="number" min="1" step="1" value="5000" class="input-stack" autocomplete="off" />
        </div>
      </div>
      <button id="reset" type="button" class="btn-reset">Reset</button>
    </header>

    <main class="main">
      <div class="table-wrap">
        <table class="grid">
          <colgroup>
            <col class="col-drag" />
            <col class="col-name" />
            <col class="col-start" />
            <col class="col-restacks" />
            <col class="col-final" />
            <col class="col-net" />
            <col class="col-adjusted" />
            <col class="col-settlements" />
            <col class="col-actions" />
          </colgroup>
          <thead>
            <tr>
              <th></th>
              <th>Name</th>
              <th>Start</th>
              <th>Restacks</th>
              <th>Final</th>
              <th>Net&nbsp;P&L</th>
              <th>Adjusted</th>
              <th>Settlements</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="grid-body"></tbody>
        </table>
      </div>
      <div class="grid-footer">
        <button id="add-player" type="button" class="btn-add">+ Add player</button>
        <button id="copy-table-image" type="button" class="btn-copy">Copy table image</button>
      </div>
    </main>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
